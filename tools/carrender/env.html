<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Preview renderer for the Bosphorus environment OBJ (build/Apex.ModelPreview --environment).
// Outdoor lighting approximating the game's SunModel; the model is mirrored on x
// (Unity left-handed -> three.js right-handed). Placeholder art, not a game capture.
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1600), Hh = +(params.get('h') || 900);
const tod = params.get('tod') || 'golden';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setSize(W, Hh);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = tod === 'night' ? 1.4 : 1.0;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Sun: true azimuth/elevation from SunModel, rotated by true north (308° in the game frame).
const north = +(params.get("north") ?? 308);
const sun = { golden: [252, 11, 0xffc78c, 2.6], day: [185, 47, 0xfff6ea, 3.0], night: [140, 38, 0x8ca6e6, 0.25] }[tod];
const az = (sun[0] + north) * Math.PI / 180, el = sun[1] * Math.PI / 180;
const sunDir = new THREE.Vector3(-Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
const skyTop = { golden: 0x6f8fb8, day: 0x6fa3dc, night: 0x0a1020 }[tod];
const fogCol = { golden: 0xc7b9a6, day: 0xb8c8d8, night: 0x0d1220 }[tod];
const scene = new THREE.Scene();
scene.background = new THREE.Color(fogCol);
scene.fog = new THREE.Fog(fogCol, 900, 9000);
const light = new THREE.DirectionalLight(sun[2], sun[3]);
light.position.copy(sunDir).multiplyScalar(3000);
scene.add(light);
scene.add(new THREE.HemisphereLight(skyTop, 0x3a352c, tod === 'night' ? 0.25 : 0.9));
const night = tod === 'night';

function facadeTexture(emissive) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  let seed = 1071; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = emissive ? '#000' : '#f2f2f2'; g.fillRect(0, 0, 256, 256);
  for (let fy = 0; fy < 8; fy++) for (let bx = 0; bx < 8; bx++) {
    const shop = fy === 0, lit = rnd() < (shop ? 0.65 : 0.3);
    const x0 = bx * 32, y0 = 256 - (fy + 1) * 32; // canvas y down, texture v up
    if (shop) {
      g.fillStyle = emissive ? (lit ? '#e6cfa8' : '#000') : '#1c2026'; g.fillRect(x0 + 2, y0 + 9, 28, 20);
      if (!emissive) { g.fillStyle = rnd() < 0.5 ? '#9e1f1a' : '#265a40'; g.fillRect(x0 + 1, y0 + 4, 30, 5); }
    } else {
      if (!emissive) { g.fillStyle = '#fafaf8'; g.fillRect(x0 + 9, y0 + 4, 14, 20); }
      g.fillStyle = emissive ? (lit ? '#ffc580' : '#000') : '#29303a'; g.fillRect(x0 + 10, y0 + 5, 12, 18);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const fa = facadeTexture(false), fe = facadeTexture(true);
const S = (o) => new THREE.MeshStandardMaterial(o);
const facadeCols = [0xe6d9ba, 0xd9ad75, 0xdb9e85, 0xc7c7c2, 0xebdb9e, 0xd9b5b0];
const mats = {
  Ground: S({ color: 0x77736a, roughness: 1 }),
  FarGround: S({ color: 0x77736a, roughness: 1 }),
  Quay: S({ color: 0x9e998c, roughness: 0.9 }),
  RoofTile: S({ color: 0xa04d33, roughness: 0.85 }),
  RoofFlat: S({ color: 0x8f8a82, roughness: 0.9 }),
  Tank: S({ color: 0xd0d0d4, roughness: 0.5, metalness: 0.4 }),
  TowerGlass: S({ color: 0x45596b, roughness: 0.15, metalness: 0.6, emissive: night ? 0x3a3a30 : 0 }),
  Bark: S({ color: 0x4d3f30, roughness: 1 }),
  Foliage: S({ color: 0x45632e, roughness: 1 }),
  Pine: S({ color: 0x33522b, roughness: 1 }),
  Cypress: S({ color: 0x1f3b22, roughness: 1 }),
  Stone: S({ color: 0xdbd3c2, roughness: 0.85, emissive: night ? 0x52452f : 0 }),
  Marble: S({ color: 0xefede6, roughness: 0.55, emissive: night ? 0x52452f : 0 }),
  Lead: S({ color: 0x737b84, metalness: 0.5, roughness: 0.5 }),
  BridgeSteel: S({ color: 0xc2c6cb, metalness: 0.4, roughness: 0.5 }),
  BridgeCable: S({ color: 0x555a60, metalness: 0.6, roughness: 0.4 }),
  Glass: S({ color: 0x1a2229, metalness: 0.5, roughness: 0.12 }),
  HagiaPlaster: S({ color: 0xcc856b, roughness: 0.85, emissive: night ? 0x52352a : 0 }),
  Rock: S({ color: 0x6b6359, roughness: 0.95 }),
  Roof: S({ color: 0xa4442e, roughness: 0.8 }),
  // Street-circuit infrastructure (match TrackInfrastructureBuilder).
  RunoffAsphalt: S({ color: 0x5e5d5b, roughness: 0.92 }),
  KerbRed: S({ color: 0xc41a14, roughness: 0.6 }),
  KerbWhite: S({ color: 0xf0f0f0, roughness: 0.6 }),
  BarrierConcrete: S({ color: 0xb4b2ac, roughness: 0.9 }),
  Armco: S({ color: 0xbfc4c8, metalness: 0.6, roughness: 0.4 }),
  Steel: S({ color: 0x3a3e44, metalness: 0.6, roughness: 0.5 }),
  ModuleNavy: S({ color: 0x1d2835, roughness: 0.6 }),
  ModuleIvory: S({ color: 0xf0e9d9, roughness: 0.6 }),
  ModuleTurquoise: S({ color: 0x087f8c, roughness: 0.6 }),
  Tire: S({ color: 0x151515, roughness: 0.9 }),
  ConveyorBelt: S({ color: 0x141416, roughness: 0.7 }),
  CatchFence: new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.5, roughness: 0.5, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }),
  Concrete: S({ color: 0xa3a3a0, roughness: 0.9 }),
  ShelterRoof: S({ color: 0x087f8c, roughness: 0.5 }),
  Extinguisher: S({ color: 0xbf0d10, roughness: 0.4 }),
  PanelHousing: S({ color: 0x15171a, roughness: 0.5 }),
  AsphaltPatch: S({ color: 0x2f2f31, roughness: 0.9 }),
  LaneDash: S({ color: 0x9c9c98, roughness: 0.7 }),
  Manhole: S({ color: 0x29292b, metalness: 0.4, roughness: 0.5 }),
  Rubber: new THREE.MeshStandardMaterial({ color: 0x050505, transparent: true, opacity: 0.38, depthWrite: false }),
  MarshalOrange: S({ color: 0xf26b0d }),
  Asphalt: S({ color: 0x3c3c3f, roughness: 0.88 }),
  // Event identity (match EventBrandingBuilder; emblem/text quads and tile texture are Unity-only).
  EventRed: S({ color: 0xc8102e, roughness: 0.55 }),
  EventTurquoise: S({ color: 0x087f8c, roughness: 0.55 }),
  EventGold: S({ color: 0xc9a66b, metalness: 0.75, roughness: 0.38 }),
  EventNavy: S({ color: 0x1d2835, roughness: 0.65 }),
  EventIvory: S({ color: 0xf0e9d9, roughness: 0.75 }),
  IznikTile: S({ color: 0x9fc6c4, roughness: 0.3 }),
  GarageDark: S({ color: 0x0d0e10, roughness: 0.7 }),
};
// Street fronts (match EnvironmentBuilder.Ensure): plaster, awnings, the Turkish flag and the shop-sign atlas.
const tl = new THREE.TextureLoader();
const srgb = (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const signTex = srgb(tl.load('/repo/unity/com.projectapex.game/Runtime/Resources/Textures/Signs/ShopSigns.jpg'));
signTex.flipY = true;
mats.ShopSign = S({ map: signTex, roughness: 0.55, emissive: night ? 0xffffff : 0, emissiveMap: signTex, emissiveIntensity: night ? 0.8 : 0 });
mats.BalconyFlag = S({ map: srgb(tl.load('flag_tex.png')), roughness: 0.75, side: THREE.DoubleSide });
mats.Door = S({ color: 0x4d301c, roughness: 0.7 });
[0x8c1a17, 0x21523a, 0x1f2b4d, 0xd9cca8].forEach((c, i) => mats['Awning' + i] = S({ color: c, roughness: 0.85, side: THREE.DoubleSide }));
// People and cats (match CityLifeComponent / CrowdComponent colours).
[0xd9d9d6, 0x1f2947, 0x801f1f, 0x333336, 0x8c7a5c, 0x40667a].forEach((c, i) => mats['CityShirt' + i] = S({ color: c, roughness: 0.9 }));
[0x1f2433, 0x141417, 0x6b614d].forEach((c, i) => mats['CityTrousers' + i] = S({ color: c, roughness: 0.9 }));
[0xc77333, 0x0f0f12, 0x7a756e, 0xe0dbd1].forEach((c, i) => mats['CatCoat' + i] = S({ color: c, roughness: 0.95 }));
mats.Skin = S({ color: 0xc69c7d, roughness: 0.8 });
mats.FanRed = S({ color: 0xd1141a, roughness: 0.85 });
mats.FanWhite = S({ color: 0xebebeb, roughness: 0.85 });
mats.KitDark = S({ color: 0x26282c, roughness: 0.6, metalness: 0.3 });
mats.Bark = S({ color: 0x6b4a2e, roughness: 0.8 });
facadeCols.forEach((c, i) => mats['FacadeSolid' + i] = S({ color: c, roughness: 0.85 }));
facadeCols.forEach((c, i) => mats['Facade' + i] = S({ color: c, map: fa, roughness: 0.85, emissive: night ? 0xffffff : 0, emissiveMap: fe, emissiveIntensity: night ? 1.2 : 0 }));

const water = new THREE.Mesh(new THREE.PlaneGeometry(30000, 30000), new THREE.MeshStandardMaterial({ color: night ? 0x050a12 : 0x2e5868, roughness: 0.25, metalness: 0.1 }));
water.rotation.x = -Math.PI / 2; water.position.y = -0.4; scene.add(water);
// &ground=1: a paved ground plane at y = 0 instead of the sea (street-front close-ups exported with --frontage).
if (params.get('ground')) { water.material = S({ color: 0x8a8580, roughness: 0.95 }); water.position.y = -0.02; }

new OBJLoader().load(params.get('obj'), (obj) => {
  obj.traverse((m) => {
    if (!m.isMesh) return;
    m.geometry.computeVertexNormals();
    const name = Array.isArray(m.material) ? m.material[0].name : m.material.name;
    m.material = mats[name] || mats.RoofFlat;
  });
  obj.scale.x = -1;
  scene.add(obj);
  const cam = new THREE.PerspectiveCamera(+(params.get('fov') || 50), W / Hh, 1, 20000);
  const e = params.get('eye').split(',').map(Number), t = params.get('target').split(',').map(Number);
  cam.position.set(-e[0], e[1], e[2]);
  cam.lookAt(-t[0], t[1], t[2]);
  const go = () => { renderer.render(scene, cam); window.renderDone = true; };
  THREE.DefaultLoadingManager.onLoad = go;
  setTimeout(go, 4000);
});
</script></body></html>
