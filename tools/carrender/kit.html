<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Preview renderer for the circuit kit OBJs (build/Apex.ModelPreview --kit): golden-hour sun from
// SunModel, procedural stand-in textures (no external assets). Not a game capture: URP Lit in Unity
// will look similar, not identical. The model is mirrored on x (Unity left-handed -> three.js).
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1600), Hh = +(params.get('h') || 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setSize(W, Hh);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9b9a3);
scene.fog = new THREE.Fog(0xc9b9a3, 250, 1200);

function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function noise(g, s, base, spread, n = 9000, size = 2) {
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  for (let i = 0; i < n; i++) {
    const v = Math.floor(spread * (Math.random() - 0.5));
    g.fillStyle = `rgba(${128 + v},${128 + v},${128 + v},0.18)`;
    g.fillRect(Math.random() * s, Math.random() * s, size, size);
  }
}
const concrete = canvasTex(256, (g, s) => {
  noise(g, s, '#b9b6ae', 120);
  // weathering streaks near the foot and the top
  const grd = g.createLinearGradient(0, s, 0, 0); grd.addColorStop(0, 'rgba(60,55,45,0.35)'); grd.addColorStop(0.15, 'rgba(60,55,45,0)');
  grd.addColorStop(0.9, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(40,40,40,0.15)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
});
const asphalt = canvasTex(256, (g, s) => noise(g, s, '#55565a', 140, 20000, 1), 6);
const fenceTex = canvasTex(128, (g, s) => {
  g.clearRect(0, 0, s, s); g.strokeStyle = 'rgba(190,195,200,1)'; g.lineWidth = 3;
  for (let i = -s; i < 2 * s; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + s, s); g.stroke(); g.beginPath(); g.moveTo(i + s, 0); g.lineTo(i, s); g.stroke(); }
}, 1);
fenceTex.repeat.set(4, 4);
// Event banners in the Bosphorus GP palette (#C8102E, #087F8C, #C9A66B, #1D2835, #F0E9D9); patterns only.
function banner(bg, fg, accent) {
  return canvasTex(512, (g, s) => {
    g.fillStyle = bg; g.fillRect(0, 0, s, s);
    g.fillStyle = accent; g.fillRect(0, s * 0.82, s, s * 0.08);
    g.fillStyle = fg;
    for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(s * (0.1 + i * 0.16), s * 0.42, s * 0.11, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = bg;
    for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(s * (0.13 + i * 0.16), s * 0.42, s * 0.085, 0, Math.PI * 2); g.fill(); }
  });
}
const M = (o) => new THREE.MeshStandardMaterial(o);
const mats = {
  BarrierConcrete: M({ map: concrete, roughness: 0.92 }),
  Concrete: M({ map: concrete, roughness: 0.9 }),
  KitDark: M({ color: 0x26272a, roughness: 0.9 }),
  Steel: M({ color: 0xaeb2b6, metalness: 0.85, roughness: 0.42 }),
  Armco: M({ color: 0xc3c7cb, metalness: 0.9, roughness: 0.3 }),
  CatchFence: M({ map: fenceTex, alphaTest: 0.4, transparent: false, side: THREE.DoubleSide, metalness: 0.7, roughness: 0.4 }),
  ModuleNavy: M({ color: 0x1d2835, roughness: 0.55 }),
  ModuleIvory: M({ color: 0xf0e9d9, roughness: 0.55 }),
  ModuleTurquoise: M({ color: 0x087f8c, roughness: 0.55 }),
  Tire: M({ color: 0x151515, roughness: 0.9 }),
  ConveyorBelt: M({ color: 0x18181a, roughness: 0.7, side: THREE.DoubleSide }),
  KitStrap: M({ color: 0x111111, roughness: 0.6 }),
  KitReflector: M({ color: 0xf2f2f2, emissive: 0x333333, roughness: 0.2 }),
  KitBanner0: M({ map: banner('#1d2835', '#c8102e', '#c9a66b'), roughness: 0.6 }),
  KitBanner1: M({ map: banner('#c8102e', '#f0e9d9', '#1d2835'), roughness: 0.6 }),
  KitBanner2: M({ map: banner('#087f8c', '#f0e9d9', '#c9a66b'), roughness: 0.6 }),
  KitBannerBack: M({ color: 0xe9e4d8, roughness: 0.7 }),
  ShelterRoof: M({ color: 0x087f8c, roughness: 0.5 }),
  Extinguisher: M({ color: 0xbf0d10, roughness: 0.4 }),
  PanelHousing: M({ color: 0x15171a, roughness: 0.5 }),
  Asphalt: M({ map: asphalt, roughness: 0.85 }),
  Line: M({ color: 0xe8e8e2, roughness: 0.7 }),
  KerbRed: M({ color: 0xb3161b, roughness: 0.6 }),
  KerbWhite: M({ color: 0xe9e9e4, roughness: 0.6 }),
  RunoffAsphalt: M({ map: asphalt, color: 0xc9c6c0, roughness: 0.9 }),
  // Monumental flag preview (tools: ModelPreview --monument; flag_tex.png from --flag).
  Stone: M({ map: concrete, color: 0xe8dcc4, roughness: 0.85 }),
  Pavement: M({ color: 0xbdb5a6, roughness: 0.8 }),
  FlagPole: M({ color: 0xd4d7da, metalness: 0.85, roughness: 0.3 }),
  EventGold: M({ color: 0xc9a66b, metalness: 1.0, roughness: 0.25 }),
  Ground: M({ color: 0x5f6b45, roughness: 1 }),
  TurkishFlag: M({ map: new THREE.TextureLoader().load('/flag_tex.png', (t) => { t.colorSpace = THREE.SRGBColorSpace; }), side: THREE.DoubleSide, roughness: 0.75 }),
};
// Optional scanned CC0 sets (&cc0=1): files prepared in ./cc0/ from Resources/Textures/CC0 (gitignored);
// UVs of road, kerbs and run-off are metric (10 m per unit), so repeat = 10 / tile size.
if (params.get('cc0')) {
  const L = new THREE.TextureLoader();
  const tex = (f, rep, srgb) => { const t = L.load('/' + (params.get('cc0dir') || 'cc0') + '/' + f); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 16; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  const set = (name, metres, paint, color) => M({
    map: tex(name + (paint ? '_paint.jpg' : '_color.jpg'), 10 / metres, true), color: color ?? 0xffffff,
    normalMap: tex(name + '_normal.png', 10 / metres, false), roughnessMap: tex(name + '_rough.png', 10 / metres, false), roughness: 1, metalness: 0,
  });
  // Linear albedo calibration as in the game (SurfaceTextures.AlbedoTint): target / mean of the scan.
  mats.Asphalt = set('asphalt', 2.0); mats.Asphalt.color.setScalar(+(params.get('asphaltTint') || 5.0));
  mats.RunoffAsphalt = set('runoff', 2.1); mats.RunoffAsphalt.color.setScalar(+(params.get('runoffTint') || 1.49));
  mats.KerbRed = set('kerb', 3.0, true, 0xc71a14);
  mats.KerbWhite = set('kerb', 3.0, true, 0xf0f0f0);
}
// Rubber atlas as in TrackInfrastructureBuilder.RubberTexture: 16 opacity bands across u (up to 55 %),
// soft across each band, streaky along v. Alpha-blended on the road.
{
  const levels = 16, band = 32, h = 64, c = document.createElement('canvas');
  c.width = band * levels; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(c.width, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < c.width; x++) {
    const level = Math.floor(x / band), u = ((x % band) + 0.5) / band * 2 - 1;
    const hsh = (a, b) => { let q = (a * 374761393 + b * 668265263) >>> 0; q = Math.imul(q ^ (q >>> 13), 1274126177) >>> 0; return ((q ^ (q >>> 16)) & 0xffff) / 0xffff; };
    const streak = 0.6 + 0.4 * hsh(Math.floor((x % band) / 2), Math.floor(y / 6));
    const a = 0.55 * level / (levels - 1) * Math.exp(-u * u * 3) * streak, k = (y * c.width + x) * 4;
    img.data[k] = img.data[k + 1] = img.data[k + 2] = 8; img.data[k + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  mats.Rubber = M({ map: t, color: 0x080808, transparent: true, depthWrite: false, roughness: 0.75, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
}
// Scanned concrete grain on the barrier blocks as a URP-style detail map (&cc0=1, files barrier_detail.jpg and
// barrier_normal.png in the cc0 folder): albedo x detail x 4.59 (unity_ColorSpaceDouble in linear space).
if (params.get('cc0')) {
  const L = new THREE.TextureLoader(), dir = '/' + (params.get('cc0dir') || 'cc0') + '/';
  const det = L.load(dir + 'barrier_detail.jpg'); det.wrapS = det.wrapT = THREE.RepeatWrapping; det.colorSpace = THREE.SRGBColorSpace; det.anisotropy = 16;
  const nrm = L.load(dir + 'barrier_normal.png'); nrm.wrapS = nrm.wrapT = THREE.RepeatWrapping; nrm.anisotropy = 16;
  const rep = new THREE.Vector2(3.8 / 2.71, 1.6 / 2.71);
  nrm.repeat.copy(rep);
  for (const key of ['BarrierConcrete', 'Concrete']) {
    const m = mats[key];
    m.normalMap = nrm; m.normalScale = new THREE.Vector2(0.8, 0.8);
    m.onBeforeCompile = (sh) => {
      sh.uniforms.detailMap = { value: det }; sh.uniforms.detailRepeat = { value: rep };
      sh.fragmentShader = 'uniform sampler2D detailMap; uniform vec2 detailRepeat;\n' + sh.fragmentShader.replace('#include <map_fragment>',
        '#include <map_fragment>\n diffuseColor.rgb *= texture2D(detailMap, vMapUv * detailRepeat).rgb * 4.59;');
    };
  }
}
const fallback = M({ color: 0xff00ff });

// Lighting. Default: the original golden-hour look (sun 252° true, 11°, true north 308°).
// &sky=<json> takes the game's values instead (dotnet run -- sky-json <time> [cloud] [north] in build/Apex.Tuning):
// sun azimuth/elevation/colour/intensity, Trilight ambient (projected into a light probe), fog, exposure.
// Unity Lit has no 1/pi in its diffuse term, three.js does: light intensities are multiplied by pi.
const sky = params.get('sky') ? JSON.parse(params.get('sky')) : null;
const north = sky ? (sky.north ?? 0) : 308;
const az = ((sky ? sky.azimuth : 252) + north) * Math.PI / 180, el = Math.max(2, sky ? sky.elevation : 11) * Math.PI / 180;
const sunDir = new THREE.Vector3(-Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
const srgb = (c) => new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
const sun = sky ? new THREE.DirectionalLight(srgb(sky.sun), sky.intensity * Math.PI) : new THREE.DirectionalLight(0xffc78c, 3.2);
if (sky) {
  scene.background = srgb(sky.fog);
  scene.fog = new THREE.Fog(srgb(sky.fog), 600, 8000);
  renderer.toneMappingExposure = Math.pow(2, sky.postExposure ?? 0);
}
const focus = (params.get('target') || '0,0,0').split(',').map(Number);
const fp = new THREE.Vector3(-focus[0], focus[1], focus[2]);
const sr = +(params.get('shadow') || 60);
sun.position.copy(fp).addScaledVector(sunDir, sr * 3); sun.target.position.copy(fp);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -sr, right: sr, top: sr, bottom: -sr, near: 1, far: sr * 6 });
scene.add(sun, sun.target);
if (sky) {
  // Trilight as Unity defines it: sky above, equator at the horizon, ground below; projected into SH.
  const S = srgb(sky.ambientSky), E = srgb(sky.ambientEquator), G = srgb(sky.ambientGround);
  const probe = new THREE.LightProbe(), basis = new Array(9).fill(0), n = 4096, d = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), phi = i * 2.399963;
    d.set(Math.cos(phi) * r, y, Math.sin(phi) * r);
    const c = y >= 0 ? E.clone().lerp(S, y) : E.clone().lerp(G, -y);
    THREE.SphericalHarmonics3.getBasisAt(d, basis);
    for (let k = 0; k < 9; k++) probe.sh.coefficients[k].add(new THREE.Vector3(c.r, c.g, c.b).multiplyScalar(basis[k] * 4 * Math.PI / n));
  }
  probe.intensity = 1;
  scene.add(probe);
} else scene.add(new THREE.HemisphereLight(0x8fa9c8, 0x5b5040, 1.1));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), M({ color: 0x6e6a5e, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = +(params.get('groundY') || -0.2); ground.receiveShadow = true; scene.add(ground);

let pending = 0, whenLoaded = null;
THREE.DefaultLoadingManager.onStart = () => { pending++; };
THREE.DefaultLoadingManager.onLoad = () => { pending = 0; if (whenLoaded) { const f = whenLoaded; whenLoaded = null; f(); } };
new OBJLoader().load(params.get('obj'), (obj) => {
  obj.traverse((m) => {
    if (!m.isMesh) return;
    const pick = (x) => mats[x.name] || fallback;
    m.material = Array.isArray(m.material) ? m.material.map(pick) : pick(m.material);
    m.castShadow = true; m.receiveShadow = true;
    m.geometry.computeVertexNormals();
  });
  obj.scale.x = -1;
  scene.add(obj);
  const cam = new THREE.PerspectiveCamera(+(params.get('fov') || 50), W / Hh, 0.05, 3000);
  const e = params.get('eye').split(',').map(Number);
  cam.position.set(-e[0], e[1], e[2]);
  cam.lookAt(fp);
  // Render only after every texture has loaded (4K maps take longer than the OBJ).
  const done = () => { renderer.render(scene, cam); window.renderDone = true; };
  if (pending === 0) done(); else whenLoaded = done;
});
</script></body></html>
